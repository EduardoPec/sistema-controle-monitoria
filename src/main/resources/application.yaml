spring:
  application:
    name: monitoria-api

  datasource:
      url: jdbc:postgresql://localhost:5432/${DB_NAME:monitoria_db}
      username: ${DB_USER:postgres}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update
